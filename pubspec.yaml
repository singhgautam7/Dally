name: dally
description: "A minimal, 100% offline games collection."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9

  # State management (3.3.x is the latest line compatible with Dart 3.11)
  flutter_riverpod: 3.3.2
  # Routing
  go_router: 17.5.0
  # Local persistence (settings, stats, saves) — no network
  shared_preferences: 2.5.5
  # Bundled vector glyphs / style sets
  flutter_svg: 2.3.0
  # Immutable models + safe (de)serialisation
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  # Pure-Dart, offline chess rules (legal moves, FEN, check/mate/stalemate).
  # Powers the Lichess mobile app; move generation is fully decoupled.
  dartchess: 0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

  # Codegen for freezed models (dev-only toolchain; ranges so the analyzer
  # constraints between build_runner and freezed can co-resolve)
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Adaptive icon + splash generation
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/glyphs/
    - assets/styles/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
