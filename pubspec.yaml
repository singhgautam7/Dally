name: dally
description: "A minimal, 100% offline games collection."
publish_to: 'none'
version: 0.5.0+5

environment:
  # 3.12 is the real floor: shared_preferences_android 2.4.24+ (the built-in
  # Kotlin migration, needed for AGP 9) requires it.
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management (3.3.x is the latest line compatible with Dart 3.11)
  flutter_riverpod: 3.3.2
  # Routing
  go_router: 17.5.0
  # Local persistence (settings, stats, saves) — no network
  shared_preferences: 2.5.5
  # Bundled vector glyphs / style sets
  flutter_svg: 2.3.0
  # Material's adaptive icons (the back button) name CupertinoIcons glyphs, so
  # the icon tree-shaker looks for that font whether or not iOS is in play.
  # Without the package it warns on every build; with it, tree-shaking keeps
  # only the glyphs actually reachable.
  cupertino_icons: 1.0.8
  # Immutable models + safe (de)serialisation
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0
  # Pure-Dart, offline chess rules (legal moves, FEN, check/mate/stalemate).
  # Powers the Lichess mobile app; move generation is fully decoupled.
  dartchess: 0.13.1
  # Bundled SFX playback (dice roll). Offline assets only — no network, no
  # analytics; pinned like every other dependency for the 3.11 SDK.
  audioplayers: 6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

  # Codegen for freezed models (dev-only toolchain; ranges so the analyzer
  # constraints between build_runner and freezed can co-resolve)
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0

  # Splash generation
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/glyphs/
    - assets/sfx/
    - assets/words/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700

# The launcher icon is the icon family's own vector drawable, converted from
# `specs/design/app-icon/` into `android/app/src/main/res/`: an adaptive icon with
# a monochrome layer for Android 13's themed icons. `flutter_launcher_icons` is
# deliberately not used, because it would replace that vector with rasterised
# PNGs. The legacy PNGs for Android before adaptive icons and the splash art
# below are rendered from the same SVGs.

flutter_native_splash:
  # The pale ground of the icon itself, so the splash reads as the launcher
  # icon holding still rather than as a different screen.
  color: "#FEDEEB"
  color_dark: "#27141C"
  image: assets/icon/splash.png
  image_dark: assets/icon/splash_dark.png
  android_12:
    # Android 12 masks its splash icon to a circle and shows only the middle of
    # it, so this art is the glyph alone on transparent and the ground is the
    # colour below. Passing the whole icon here gets it cropped.
    image: assets/icon/splash_android12.png
    image_dark: assets/icon/splash_android12_dark.png
    icon_background_color: "#FEDEEB"
    icon_background_color_dark: "#27141C"
    color: "#FEDEEB"
    color_dark: "#27141C"
  android: true
  ios: false
  web: false
